name: Pruebas
on:
  push:
    paths: ["app.py", "tests/**", "sw.js", "index.html", "js/**", "css/**", "img/**", "curriculum_gramatica.py"]
  workflow_dispatch:
jobs:
  reto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask flask-cors python-dotenv requests
      - run: python tests/test_reto.py
      - run: python tests/test_sw.py
      - run: python tests/test_maestro.py
